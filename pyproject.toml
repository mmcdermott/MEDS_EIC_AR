[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MEDS_EIC_AR"
dynamic = ["version"]
authors = [
  {name="Matthew McDermott", email="mattmcdermott8@gmail.com"},
  {name="Nassim Oufattole", email="noufattole@gmail.com"},
  {name="Teya Bergamaschi", email="teyabergamaschi@gmail.com"},
  {name="Aleksia Kolo", email="aleksiakolo@gmail.com"},
]
description = "A simple auto-regressive, 'everything-is-code' style model for MEDS datasets"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "polars~=1.35",
  "pyarrow",
  "hydra-core",
  "numpy",
  "meds~=0.4.0",
  "filelock",
  "pytest",
  "meds_testing_helpers~=0.3.0",
  "MEDS-transforms~=0.6.7",
  "meds-torch-data[lightning]~=0.9.0",
  "transformers>=4.56",
  "torch",
  "torchmetrics",
  "lightning~=2.5.1",
  "MEDS_trajectory_evaluation~=0.0.6",
]

[dependency-groups]
dev = ["pre-commit<4", "ruff", "pytest-cov", "pretty_print_directory>=0.1.2", "yaml_to_disk"]

[tool.setuptools_scm]

[project.optional-dependencies]
# Extensions
wandb = ["wandb"]
mlflow = ["mlflow", "psutil", "pynvml"]
# Inference backend — lazy-imported inside ``MEDS_EIC_AR.model.backends.sglang``, only
# needed for ``backend=sglang`` generation runs. See issues #88 and #109 for context.
#
# Installation note: the bound is deliberately loose. On Python 3.11 a fresh resolve of
# ``sglang>=0.4`` selects ``sglang==0.5.9``, whose own pins (``torch==2.9.1``,
# ``transformers==4.57.1``, ``sgl-kernel==0.3.21``) already agree with this project's
# ``uv.lock``; pinning here would instead force the default resolve to re-check the pin
# against the other extras' envelopes on every sync. Pin in your deployment lockfile if you
# need reproducibility; the ``GenerationBackend`` protocol isolates us from API churn.
#
# ``--prerelease=allow`` is *not* required for ``sglang==0.5.9``. It was needed only for
# ``0.5.10.post1``, which pulled a pre-release ``flash-attn-4``. Note that ``flash-attn-4``
# provides the ``flash_attn`` module namespace without matching distribution metadata, which
# breaks ``importlib.metadata.version("flash_attn")`` callers — this project falls back to
# SDPA cleanly when it is absent, so prefer leaving it uninstalled.
#
# GPU wheels are *not* fully expressible here. ``sgl-kernel`` on PyPI ships CUDA kernel images
# only up to ``sm_120a``, so it raises ``no kernel image is available for execution on the
# device`` on Blackwell parts at compute capability 12.1 (e.g. GB10 / DGX Spark). Those hosts
# need the CUDA-13 build from SGLang's own index, which pip/uv cannot select from an extra:
#
#     uv pip install --index-url https://docs.sglang.ai/whl/cu130/ "sgl-kernel==0.3.21+cu130"
#
# See ``README.md`` ("Running SGLang on Blackwell SM 12.1") for the full recipe, and issue #163.
sglang = ["sglang>=0.4"]

[project.urls]
Homepage = "https://github.com/mmcdermott/MEDS_EIC_AR"
Issues = "https://github.com/mmcdermott/MEDS_EIC_AR/issues"

[project.scripts]
# Data preprocessing
MEICAR_process_data = "MEDS_EIC_AR.preprocessing.__main__:process_data"
# Model training
MEICAR_pretrain = "MEDS_EIC_AR.__main__:pretrain"
# Generation
MEICAR_generate_trajectories = "MEDS_EIC_AR.__main__:generate_trajectories"

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--doctest-modules",
  "--ignore=docs",
  "--doctest-glob=*.md",
]
python_classes = "!TestEnv"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]
markers = [
  "parallelized: mark test as parallelized, requiring hydra-joblib-launcher",
]

[tool.coverage.run]
# Capture coverage from subprocess-based CLI tests (conftest.py runs
# MEICAR_pretrain / MEICAR_generate_trajectories / MEICAR_process_data via
# subprocess.run). coverage.py's built-in "subprocess" patch does the right
# thing automatically: it monkeypatches subprocess.Popen/spawnv/etc. at
# coverage-start time so every Python subprocess gets coverage tracking
# without any .pth file installation or COVERAGE_PROCESS_START env var.
# Setting `patch = ["subprocess"]` also implies `parallel = true`.
# See https://pytest-cov.readthedocs.io/en/latest/subprocess-support.html.
patch = ["subprocess"]
source = ["src/MEDS_EIC_AR"]

[tool.coverage.report]
exclude_also = ["logger\\.debug", "except ImportError:", "if TYPE_CHECKING:"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["docs/index.md"]

# Enable linters
[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "N",   # pep8-naming
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__ files
"__main__.py" = ["F401"]  # Unused imports in __main__ files as we use them for OmegaConf Resolvers

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["*MEDS*", "F", "L", "M", "D", "LR_*", "*GPT*"]  # Ignore MEDS in variable names

[tool.uv]
# Force the lock to carry distributions for ARM64 as well as the x86_64 host it is usually
# resolved on. Without this, a dependency reachable *only* under an ARM marker gets a package
# stanza with no `sdist` and no `wheels` at all: the resolver never explored that branch, so it
# recorded nothing to install, and `uv sync` on an ARM host fails with "can't be installed because
# it doesn't have a source distribution or wheel for the current platform". `av`, pulled in by the
# `sglang` extra under an aarch64-only marker, hit exactly that on a DGX Spark.
#
# `required-environments` rather than `environments`: the latter would *restrict* resolution to the
# listed set and silently drop support for anything not enumerated (Windows, for one). This only
# widens what the lock must cover.
#
# Only the Linux ARM branch is listed. Adding macOS ARM was tried and rejected: `sglang` publishes
# no macOS ARM wheels at 0.5.9, so requiring coverage there forks the resolution back to 0.5.2 and
# drops `mlx-lm`/`mlx-metal` — a 250-line lock churn and a downgrade of the pin this branch's
# install recipe is written against, to cover a platform the `sglang` extra cannot run on anyway.
required-environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]
